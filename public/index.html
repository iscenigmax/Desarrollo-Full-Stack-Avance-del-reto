<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Vehículos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Gestión de Vehículos</h1>
  <p id="mensaje"></p>

  <!-- Pantalla de acceso -->
  <section id="login">
    <h2>Acceso</h2>
    <input id="username" placeholder="Usuario">
    <input id="password" type="password" placeholder="Contraseña">
    <button id="btn-login">Iniciar sesión</button>
    <button id="btn-register">Registrarse</button>
  </section>

  <!-- Pantalla principal -->
  <section id="app" hidden>
    <button id="btn-salir">Salir</button>

    <h2>Vehículo</h2>
    <form id="form-vehiculo">
      <input id="marca" placeholder="Marca" required>
      <input id="modelo" placeholder="Modelo" required>
      <input id="anio" type="number" placeholder="Año" required>
      <input id="precio" type="number" placeholder="Precio" required>
      <button type="submit">Guardar</button>
    </form>

    <h2>Inventario</h2>
    <table>
      <thead>
        <tr><th>Marca</th><th>Modelo</th><th>Año</th><th>Precio</th><th>Acciones</th></tr>
      </thead>
      <tbody id="tabla"></tbody>
    </table>
  </section>

  <script src="app.js"></script>
</body>
</html>
